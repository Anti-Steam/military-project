# ============================================================================
# Состав стенда разработки.
#
# Версии образов зафиксированы намеренно: у трех разработчиков разные ОС,
# а целевая система — Astra Linux. Фиксация версий гарантирует, что
# окружение везде одинаковое (раздел 3.3 ТЗ).
#
# Запуск:   docker compose up -d
# Остановка: docker compose down
# ============================================================================

name: military

services:

  db:
    # Debian-совместимый образ: Astra Linux также основана на Debian,
    # поэтому поведение окружения ближе к целевому, чем у alpine.
    image: postgres:16
    container_name: military_db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      # Пояс задается переменной TZ из .env — тем же значением, что и у
      # приложения. Расхождение поясов дает сдвиг времени в отчетах.
      TZ: ${TZ:-Asia/Krasnoyarsk}
      PGTZ: ${TZ:-Asia/Krasnoyarsk}

    # Порт открыт ТОЛЬКО на локальном интерфейсе 127.0.0.1.
    # Без этого префикса Docker выставил бы БД на все сетевые интерфейсы
    # машины, то есть в локальную сеть.
    ports:
      - "127.0.0.1:${DB_PORT}:5432"

    # Именованный том: данные переживают пересоздание контейнера.
    volumes:
      - db_data:/var/lib/postgresql/data

    # Проверка готовности. Нужна, чтобы приложение и миграции не стартовали
    # раньше, чем СУБД примет соединения.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10

# Сервис app будет добавлен, когда появится код в services/app.
# Сервис nginx — на этапе 3, при подготовке стенда.

volumes:
  db_data:
